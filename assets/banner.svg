<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <!-- Wave path bottom -->
  </defs>

  <!-- Background -->
  <rect width="900" height="200" fill="url(#bg)" />

  <!-- Wave shape at bottom -->
  <path d="M0,140 C150,180 300,100 450,140 C600,180 750,110 900,140 L900,200 L0,200 Z" fill="#0d1117" opacity="0.18"/>
  <path d="M0,160 C120,140 250,175 400,158 C550,141 700,170 900,155 L900,200 L0,200 Z" fill="#0d1117" opacity="0.25"/>

  <!-- Name -->
