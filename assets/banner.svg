  <!-- Subtitle -->
  <text x="450" y="132" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#e2e8f0" text-anchor="middle" letter-spacing="0.5">Software &amp; Applied AI Systems Engineer</text>

  <!-- Decorative dot accents -->
  <circle cx="60" cy="50" r="22" fill="#ffffff" opacity="0.07"/>
  <circle cx="840" cy="40" r="30" fill="#ffffff" opacity="0.07"/>
  <circle cx="820" cy="150" r="14" fill="#f59e0b" opacity="0.18"/>
  <circle cx="80" cy="160" r="10" fill="#f59e0b" opacity="0.15"/>
</svg>
